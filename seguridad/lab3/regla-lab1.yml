# =============================================================================
# Laboratorio 3 · Fase CODIFY (Find → Extract → Codify → Scale)
# Equipo: Garcia - Vargas — Tatiana García Grajales (@Tatianag2) y Javier Alejandro Vargas (@javargasp26)
# Codifica las amenazas del Top 5 del Lab 1 / verificadas con ASVS 5.0 en el Lab 2.
# Probar con:  semgrep --test seguridad/lab3/
# =============================================================================
rules:
  - id: ucp.lab3.sqli-interpolacion-consulta
    languages: [python]
    severity: ERROR
    message: >-
      [Amenaza Lab 1 #1 (T/I/E) · ASVS V1.2.4] Consulta SQL construida mediante
      interpolación de cadenas (f-string, % o +) en $DB.execute(). Use consultas
      parametrizadas: $DB.execute("SELECT ... WHERE col = ?", (valor,)).
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021"
      asvs: "V1.2.4"
      amenaza_lab1: "Amenaza #1 (STRIDE: Tampering / Information Disclosure / Elevation of Privilege) - Inyección SQL en buscador y actualización de perfil"
    patterns:
      - pattern-either:
          - pattern: $DB.execute(f"...", ...)
          - pattern: $DB.execute("..." + $X, ...)
          - pattern: $DB.execute("..." % $X, ...)
          - pattern: $DB.execute("...".format(...), ...)

  - id: ucp.lab3.jwt-sin-verificar-firma
    languages: [python]
    severity: ERROR
    message: >-
      [Amenaza Lab 1 #3 (S/T) · ASVS V9.2.1] Decodificación de JWT con
      verify_signature=False. Permite falsificar tokens (alg: none o clave arbitraria).
      Verifique la firma y fije algorithms=["HS256"].
    metadata:
      cwe: "CWE-347"
      owasp: "A07:2021"
      asvs: "V9.2.1"
      amenaza_lab1: "Amenaza #3 (STRIDE: Spoofing / Tampering) - Falsificación de sesión o token JWT"
    pattern-either:
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
      - pattern: 'jwt.decode(..., verify=False, ...)'
